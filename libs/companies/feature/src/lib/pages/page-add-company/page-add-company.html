<h1 class="h3 mb-3">{{ 'companies.add.title' | transloco }}</h1>

<!-- if signal error pour afficher un message d'erreur (error() contient une clé de traduction) -->
@if (error()) {
  <div class="alert alert-danger" role="alert">{{ error() | transloco }}</div>
}

<app-form-company submitLabel="companies.add.submit" (save)="onSave($event)" />
